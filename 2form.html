<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

<h1>Welcome to NRC</h1>
<p>Fill the information below to create a new account</p>

<form action="https://nrc.gsds.ng">

<label>First Name</label><br>
<input type="text" placeholder="Enter First Name"><br><br>

<label>Last Name</label><br>
<input type="text" placeholder="Enter Last Name"><br><br>

<label>Phone Number</label><br>
<input type="text" placeholder="+234 Enter Phone"><br><br>

<label>Date Of Birth</label><br>
<input type="date"><br><br>

<label>Gender</label><br>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other<br><br>

<label>Identification Type</label><br>
<select>
<option>Select Identification</option>
<option>NIN</option>
<option>Passport</option>
<option>Driver's License</option>
<option>Voter's Card</option>
</select><br><br>

<label>ID Number</label><br>
<input type="text" placeholder="Enter Number"><br><br>

<label>Email</label><br>
<input type="email" placeholder="Enter Email"><br><br>

<label>Password</label><br>
<input type="password" placeholder="Enter Password"><br><br>

<label>Confirm Password</label><br>
<input type="password" placeholder="Confirm Password"><br><br>

<input type="checkbox"> By proceeding with the registration, I confirm that I have read and accept the Privacy Policy and Terms of Service<br><br>

<input type="submit" value="Sign Up">

</form>

</body>
</html>
</body>
</html>
